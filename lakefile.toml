name = "lean-mqsp"
defaultTargets = ["MQSP"]
testDriver = "MQSPTest"

[leanOptions]
pp.unicode.fun = true
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
weak.linter.style.header.license = "Released under MIT license as described in the file LICENSE."
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.34.1"

[[lean_lib]]
name = "MQSP"

[[lean_lib]]
name = "MQSPTest"
srcDir = "test"
